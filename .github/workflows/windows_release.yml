name: Windows Release

on:
  push:
    branches:
      - 'Argos_Stable4.4'
      - 'ALES_QGC_V01.02.00'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
    - '*'
    paths-ignore:
      - 'docs/**'

defaults:
  run:
    shell: cmd

env:
  SOURCE_DIR:   ${{ github.workspace }}
  QT_VERSION:   5.15.2
  ARTIFACT:     AlesQGroundControl-installer.exe
  BUILD_TYPE:   ${{ fromJSON('["DailyBuild", "StableBuild"]')[ github.ref_type == 'tag' || contains(github.ref, 'Stable_' ) ] }}

jobs:
  build:
    runs-on:  windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get all tags for correct version determination
        working-directory:  ${{ github.workspace }}
        run: |
          git fetch --all --tags -f --depth 1

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version:      ${{ env.QT_VERSION }}
          host:         windows
          target:       desktop
          arch:         win64_msvc2019_64
          dir:          ${{ runner.temp }}
          modules:      qtcharts
          setup-python: false

      - name: Download JOM
        run: |
          curl -L -o ${{ runner.temp }}\jom.zip https://download.qt.io/official_releases/jom/jom_1_1_4.zip
          7z x ${{ runner.temp }}\jom.zip -o${{ runner.temp }}\jom -y

      - name: Download Gstreamer
        uses: suisei-cn/actions-download-file@v1.3.0
        with:
          url:    https://s3-us-west-2.amazonaws.com/qgroundcontrol/dependencies/gstreamer-1.0-msvc-x86_64-1.18.1.msi
          target: ${{ runner.temp }}\

      - name: Download Gstreamer dev
        uses: suisei-cn/actions-download-file@v1.3.0
        with:
          url:    https://s3-us-west-2.amazonaws.com/qgroundcontrol/dependencies/gstreamer-1.0-devel-msvc-x86_64-1.18.1.msi
          target: ${{ runner.temp }}\

      - name: Install Gstreamer
        run:  |
            cmd /c start /wait msiexec /package ${{ runner.temp }}\gstreamer-1.0-msvc-x86_64-1.18.1.msi /passive ADDLOCAL=ALL
            cmd /c start /wait msiexec /package ${{ runner.temp }}\gstreamer-1.0-devel-msvc-x86_64-1.18.1.msi /passive ADDLOCAL=ALL

      - name: Install NSIS and VC++ Runtime
        shell: pwsh
        run: |
            Write-Host "Installing NSIS..."
            choco install nsis -y

            $nsisPath = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (!(Test-Path $nsisPath)) {
                throw "makensis.exe not found after NSIS install"
            }
            Write-Host "NSIS OK: $nsisPath"

            Write-Host "Downloading VC++ 2015-2022 Redistributable (x64)..."
            $vcRedist = "$env:TEMP\vc_redist.x64.exe"
            Invoke-WebRequest `
              -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
              -OutFile $vcRedist

            if (!(Test-Path $vcRedist)) {
                throw "vc_redist.x64.exe download failed"
            }

            Write-Host "Installing VC++ Redistributable..."
            Start-Process `
              -FilePath $vcRedist `
              -ArgumentList "/install /quiet /norestart" `
              -Wait

            Write-Host "VC++ Redistributable install completed"



      - name: Create build directory
        run:  mkdir ${{ runner.temp }}\shadow_build_dir

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Build
        working-directory: ${{ runner.temp }}\shadow_build_dir
        run:  |
              qmake -r ${{ env.SOURCE_DIR }}\qgroundcontrol.pro CONFIG+=installer CONFIG+=${{ env. BUILD_TYPE }}
              ${{ runner.temp }}\jom\jom -j2

      - name: Save installer artifact
        uses: actions/upload-artifact@master
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}\shadow_build_dir\staging\${{ env.ARTIFACT }}

      - name: Save PDB artifact
        uses: actions/upload-artifact@master
        with:
          name: qgroundcontrol.pdb
          path: ${{ runner.temp }}\shadow_build_dir\staging\qgroundcontrol.pdb

      - name: Publish installer artifact to GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ runner.temp }}\shadow_build_dir\staging\${{ env.ARTIFACT }}
          asset_name: ${{ env.ARTIFACT }}
          tag: ${{ github.ref }}
          overwrite: true

      - name: Publish PDB artifact to GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ runner.temp }}\shadow_build_dir\staging\qgroundcontrol.pdb
          asset_name: qgroundcontrol.pdb
          tag: ${{ github.ref }}
          overwrite: true

      # - name: Upload build to S3 Bucket
      #   if:                 github.event_name == 'push'
